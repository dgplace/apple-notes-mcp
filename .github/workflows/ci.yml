name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    # Build + unit tests need no Notes.app or automation permission. The
    # integration test touches a real Notes library, so it remains opt-in and
    # is not run in CI.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # Lifecycle scripts are disabled during dependency materialization. This
      # skips prepare, so the explicit build below is a required separate step.
      - run: npm ci --ignore-scripts
      - run: npm run check:dependency-engines
      - run: npm run build
      - run: npm test
